services:
  - type: web
    name: spotter-weather-routing-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://replace-with-your-vercel-app.vercel.app
      - key: ORS_API_KEY
        sync: false
      - key: GRAPHHOPPER_API_KEY
        sync: false
      - key: APP_USER_AGENT
        value: spotter-weather-routing/1.0 (assessment)
      - key: WEB_CONCURRENCY
        value: "3"
